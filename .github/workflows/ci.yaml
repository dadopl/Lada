name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Coding standard
        run: composer cs

      - name: Static analysis
        run: composer stan

      - name: Unit tests
        run: composer test
